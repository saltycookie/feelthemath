  <g transform="translate(0 2)" fill="none" stroke-linecap="round">
    <path d="M90.38 45.11A33 33 0 0 1 79.86 84.35M29.62 70.89A33 33 0 0 1 40.14 31.65" stroke="#8fcbff" stroke-opacity=".6" stroke-width="6"/>
    <path d="M79.33 49.79A21 21 0 0 1 72.64 74.77M40.67 66.21A21 21 0 0 1 47.36 41.23" stroke="#8fcbff" stroke-width="7"/>
    <path d="M26 95H34.09C43.52 95 51.78 88.66 54.23 79.55L65.77 36.45C68.22 27.34 76.48 21 85.91 21H94" stroke="#f4f1e8" stroke-width="8"/>
