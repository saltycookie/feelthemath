<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- The site icon: a touch point on a rising curve, with ripples, on a chalkboard tile. The curve is drawn like an
       italic f: a straight, steep stem through the touch point, with a round hook at each end; the ripples sit
       square to the stem.
       Drawn a little bolder than the logo on the home page so it still reads at 16 px.
       favicon.ico and apple-touch-icon.png are made from this file: python3 tools/icons.py -->
